name: CI

# Vercel builds every push, but only this job runs the localized-site check
# (every locale page, manifest, sitemap URL and hreflang alternate, the
# redirect rules and the live proof) against the production build.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and localized-site check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Without the signing key (Vercel only) the build is recorded as unsigned.
      - run: npm run build
      - run: npm run typecheck
      - name: Localized-site check
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/ && break; sleep 1; done
          npm run check:i18n:site -- http://localhost:3000
